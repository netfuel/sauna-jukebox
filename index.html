<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAUNA Jukebox</title>
  <meta name="description" content="283 videos. Play them all.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jukebox.saunamemphis.com/">
  <meta property="og:title" content="SAUNA Jukebox">
  <meta property="og:description" content="283 videos. Play them all.">
  <meta property="og:image" content="https://jukebox.saunamemphis.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://jukebox.saunamemphis.com/">
  <meta name="twitter:title" content="SAUNA Jukebox">
  <meta name="twitter:description" content="283 videos. Play them all.">
  <meta name="twitter:image" content="https://jukebox.saunamemphis.com/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <div class="site-title reveal">
        <img src="/sauna-logo.png" alt="SAUNA" class="site-logo" />
        <span class="site-subtitle">Jukebox</span>
      </div>
    </div>
    <div class="header-right">
      <span class="video-count reveal">283 Videos</span>
      <button class="shuffle-btn reveal" aria-label="Shuffle videos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/>
          <line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/>
          <line x1="15" y1="15" x2="21" y2="21"/>
        </svg>
      </button>
      <button class="view-toggle reveal" aria-label="Switch view">
        <span class="toggle-icon toggle-icon--grid active" id="toggleIcon">&#9638;</span>
      </button>
    </div>
  </header>

  <section class="view view--table active" id="tableView">
    <div class="table-header">
      <span class="col col--num">#</span>
      <span class="col col--title">Title</span>
      <span class="col col--artist">Artist</span>
      <span class="col col--play"></span>
    </div>
    <div class="table-body" id="tableBody"></div>
  </section>

  <section class="view view--grid" id="gridView"></section>

  <div class="mini-player" id="miniPlayer">
    <img class="mini-player__thumb" id="miniThumb" src="" alt="">
    <div class="mini-player__info">
      <span class="mini-player__title" id="miniTitle"></span>
      <span class="mini-player__artist" id="miniArtist"></span>
    </div>
    <div class="mini-player__controls">
      <button class="mini-player__btn" id="miniPrev" aria-label="Previous"></button>
      <button class="mini-player__btn mini-player__btn--playpause" id="miniPlayPause" aria-label="Play / Pause"></button>
      <button class="mini-player__btn" id="miniNext" aria-label="Next"></button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
